<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAFAFA;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #E5E7EB;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #D1D5DB;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="text-gray-900 antialiased min-h-screen pb-12">

    <div class="max-w-7xl mx-auto px-6 lg:px-8 pt-12">
        <div id="msg"
            class="hidden fixed top-6 right-6 px-5 py-3.5 rounded-lg text-sm font-medium border shadow-lg transition-all duration-300 z-50">
        </div>

        <div id="view-list" class="block fade-in">
            <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                <div>
                    <h1 class="text-3xl font-semibold tracking-tight text-gray-900">Clientes</h1>
                    <p class="text-gray-500 mt-1 text-sm">Gerenciamento de base de contatos.</p>
                </div>
                <button onclick="abrirFormulario()"
                    class="bg-gray-900 hover:bg-gray-800 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition-colors shadow-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Novo cliente
                </button>
            </header>

            <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden min-h-[400px]">
                <div id="tabela-wrap"></div>
            </div>
        </div>

        <div id="view-form" class="hidden fade-in">

            <nav class="flex items-center text-sm font-medium text-gray-500 mb-8">
                <button onclick="voltarParaLista()"
                    class="hover:text-gray-900 transition-colors focus:outline-none">Clientes</button>
                <svg class="w-4 h-4 mx-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
                <span id="breadcrumb-current" class="text-gray-900">Novo Cadastro</span>
            </nav>

            <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8 md:p-10 w-full">

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-x-12 gap-y-8">

                    <div class="lg:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Nome completo <span
                                class="text-red-500">*</span></label>
                        <input id="f-nome" type="text" placeholder="Informe o nome"
                            class="w-full text-sm px-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900 transition-shadow placeholder-gray-400">
                        <p id="err-nome" class="hidden text-red-500 text-xs mt-1.5">O nome é obrigatório.</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">CPF <span
                                class="text-red-500">*</span></label>
                        <input id="f-cpf" type="text" placeholder="000.000.000-00" maxlength="14"
                            class="w-full text-sm px-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900 transition-shadow placeholder-gray-400">
                        <p id="err-cpf" class="hidden text-red-500 text-xs mt-1.5">O CPF é obrigatório.</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Telefone</label>
                        <input id="f-telefone" type="text" placeholder="(35) 00000-0000"
                            class="w-full text-sm px-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900 transition-shadow placeholder-gray-400">
                    </div>

                    <div class="lg:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">E-mail</label>
                        <input id="f-email" type="email" placeholder="Informe o e-mail"
                            class="w-full text-sm px-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900 transition-shadow placeholder-gray-400">
                    </div>

                    <div class="lg:col-span-2 border-t border-gray-100 my-2"></div>

                    <div class="lg:col-span-2 grid grid-cols-4 gap-6">
                        <div class="col-span-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Logradouro</label>
                            <input id="f-logradouro" type="text" placeholder="Rua, Avenida..."
                                class="w-full text-sm px-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900 transition-shadow placeholder-gray-400">
                        </div>
                        <div class="col-span-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Nº</label>
                            <input id="f-numero" type="text" placeholder="Ex: 100"
                                class="w-full text-sm px-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900 transition-shadow placeholder-gray-400">
                        </div>
                    </div>

                    <div class="lg:col-span-2 grid grid-cols-12 gap-6">
                        <div class="col-span-12 md:col-span-5">
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Bairro</label>
                            <input id="f-bairro" type="text" placeholder="Ex: Centro"
                                class="w-full text-sm px-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900 transition-shadow placeholder-gray-400">
                        </div>
                        <div class="col-span-8 md:col-span-5">
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Cidade</label>
                            <input id="f-cidade" type="text" placeholder="Ex: Belo Horizonte"
                                class="w-full text-sm px-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900 transition-shadow placeholder-gray-400">
                        </div>
                        <div class="col-span-4 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">UF</label>
                            <input id="f-uf" type="text" placeholder="Ex: MG" maxlength="2"
                                class="w-full text-sm px-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900 transition-shadow placeholder-gray-400">
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-4 mt-12">
                    <button onclick="salvar()"
                        class="bg-gray-900 hover:bg-gray-800 text-white font-medium px-8 py-3 rounded-lg text-sm transition-colors shadow-sm">
                        Salvar dados
                    </button>
                    <button onclick="voltarParaLista()"
                        class="bg-white hover:bg-gray-50 text-gray-700 border border-gray-200 font-medium px-8 py-3 rounded-lg text-sm transition-colors">
                        Cancelar
                    </button>
                </div>
            </div>
        </div>

    </div>
    <script src="clientes.js"></script>
</body>

</html>

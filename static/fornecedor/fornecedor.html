<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fornecedores | Sistema Comercial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #0f5f3e;
      --brand-dark: #0a432c;
      --bg: #f4f7f4;
    }
    body {
      font-family: "Manrope", sans-serif;
      background-color: var(--bg);
    }
    .topbar {
      background: linear-gradient(90deg, var(--brand-dark), var(--brand));
    }
    .btn-brand {
      background-color: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }
    .btn-brand:hover {
      background-color: var(--brand-dark);
      border-color: var(--brand-dark);
      color: #fff;
    }
    .table thead {
      background-color: var(--brand);
      color: #fff;
    }
    .table thead th {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .table tbody td {
      font-size: 0.83rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 0;
    }
    .table tbody td.col-acoes {
      overflow: visible;
      white-space: nowrap;
      max-width: none;
    }
    .table tbody tr:hover {
      background-color: #f0f7f3;
    }
    .col-id     { width: 50px; }
    .col-nome   { width: 20%; }
    .col-cnpj   { width: 15%; }
    .col-tel    { width: 13%; }
    .col-email  { width: 22%; }
    .col-cidade { width: 13%; }
    .col-acoes  { width: 130px; }
    .modal-header-brand {
      background: linear-gradient(90deg, var(--brand-dark), var(--brand));
    }
    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--brand);
      border-bottom: 2px solid #e9f4ee;
      padding-bottom: 4px;
      margin-bottom: 12px;
    }
    .table-footer {
      font-size: 0.75rem;
      color: #6c757d;
      padding: 8px 16px;
      border-top: 1px solid #e9ecef;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--brand);
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <header class="topbar py-3 text-white shadow-sm mb-4">
    <div class="container">
      <h1 class="h5 fw-bold mb-0">Cadastro de Fornecedores</h1>
    </div>
  </header>

  <main class="container pb-5">

    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3">
        <div>
          <h2 class="h6 fw-bold mb-1">Lista de Fornecedores</h2>
          <p class="text-muted mb-0 small">Gerencie os fornecedores cadastrados no sistema.</p>
        </div>
        <button type="button" class="btn btn-brand btn-sm px-4" onclick="novo()">
          + Novo Fornecedor
        </button>
      </div>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" style="table-layout: fixed; width: 100%;">
            <thead>
              <tr>
                <th class="ps-3 col-id">#</th>
                <th class="col-nome">Nome</th>
                <th class="col-cnpj">CNPJ</th>
                <th class="col-tel">Telefone</th>
                <th class="col-email">E-mail</th>
                <th class="col-cidade">Cidade / UF</th>
                <th class="text-center col-acoes">Ações</th>
              </tr>
            </thead>
            <tbody id="dados">
              <tr>
                <td colspan="7" class="text-center text-muted py-4" style="max-width: none;">Carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="table-footer" id="rodape" style="display:none;">
          <span><span class="status-dot"></span><span id="totalRegistros">0</span> fornecedor(es) cadastrado(s)</span>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="modalFornecedor" tabindex="-1" aria-labelledby="modalFornecedorLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content border-0 shadow">

        <div class="modal-header modal-header-brand">
          <h5 class="modal-title text-white fw-bold" id="modalFornecedorLabel">Novo Fornecedor</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>

        <div class="modal-body p-4">

          <p class="section-label">Dados principais</p>
          <div class="row g-3 mb-3">
            <div class="col-12 col-md-6">
              <label for="txtNome" class="form-label fw-semibold">Nome</label>
              <input type="text" class="form-control" id="txtNome" placeholder="Razão social ou nome fantasia">
            </div>
            <div class="col-12 col-md-6">
              <label for="txtCnpj" class="form-label fw-semibold">CNPJ</label>
              <input type="text" class="form-control" id="txtCnpj" placeholder="00.000.000/0000-00">
            </div>
            <div class="col-12 col-md-6">
              <label for="txtTelefone" class="form-label fw-semibold">Telefone</label>
              <input type="text" class="form-control" id="txtTelefone" placeholder="(00) 00000-0000">
            </div>
            <div class="col-12 col-md-6">
              <label for="txtEmail" class="form-label fw-semibold">E-mail</label>
              <input type="email" class="form-control" id="txtEmail" placeholder="contato@empresa.com">
            </div>
          </div>

          <p class="section-label mt-2">Endereço</p>
          <div class="row g-3">
            <div class="col-12 col-md-8">
              <label for="txtLogradouro" class="form-label fw-semibold">Logradouro</label>
              <input type="text" class="form-control" id="txtLogradouro" placeholder="Rua, Avenida, etc.">
            </div>
            <div class="col-12 col-md-4">
              <label for="txtNumero" class="form-label fw-semibold">Número</label>
              <input type="text" class="form-control" id="txtNumero" placeholder="Nº">
            </div>
            <div class="col-12 col-md-4">
              <label for="txtBairro" class="form-label fw-semibold">Bairro</label>
              <input type="text" class="form-control" id="txtBairro" placeholder="Bairro">
            </div>
            <div class="col-12 col-md-5">
              <label for="txtCidade" class="form-label fw-semibold">Cidade</label>
              <input type="text" class="form-control" id="txtCidade" placeholder="Cidade">
            </div>
            <div class="col-12 col-md-3">
              <label for="txtUf" class="form-label fw-semibold">UF</label>
              <select class="form-select" id="txtUf">
                <option value="">—</option>
                <option>AC</option><option>AL</option><option>AM</option><option>AP</option>
                <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
                <option>GO</option><option>MA</option><option>MG</option><option>MS</option>
                <option>MT</option><option>PA</option><option>PB</option><option>PE</option>
                <option>PI</option><option>PR</option><option>RJ</option><option>RN</option>
                <option>RO</option><option>RR</option><option>RS</option><option>SC</option>
                <option>SE</option><option>SP</option><option>TO</option>
              </select>
            </div>
          </div>

        </div>

        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-brand" onclick="salvar()">Salvar</button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="fornecedores.js"></script>
</body>
</html>

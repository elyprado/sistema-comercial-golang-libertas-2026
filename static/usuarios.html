<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Cadastro de Usuários</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <h1>Cadastro de Usuários</h1>
        <button type="button" class="btn btn-primary" onclick="novo()">Novo</button>
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Telefone</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="dados">
            </tbody>
        </table>

<div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Cadastro de Usuário</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        
        <div class="input-group mb-3">
        <span class="input-group-text" id="basic-addon1">Nome:</span>
        <input type="text" class="form-control" aria-describedby="basic-addon1" id="txtNome">
        </div>
        <div class="input-group mb-3">
        <span class="input-group-text" id="basic-addon1">Telefone:</span>
        <input type="text" class="form-control"  aria-describedby="basic-addon1" id="txtTelefone">
        </div>
        <div class="input-group mb-3">
        <span class="input-group-text" id="basic-addon1">E-mail</span>
        <input type="text" class="form-control" aria-describedby="basic-addon1" id="txtEmail">
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="salvar()" >Salvar</button>
      </div>
    </div>
  </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
        var idusuarioedicao = 0;

        async function fetchJson(url, options = {}) {
            const token = sessionStorage.getItem('token');
            options.headers = options.headers || {};
            if (token) {
                options.headers.Authorization = 'Bearer ' + token;
            }
            const resp = await fetch(url, options);
            if (!resp.ok) throw new Error('Erro na requisição: ' + url);
            return resp.json();
        }

        async function salvar() {
            const usuario = {
                nome: document.getElementById("txtNome").value,
                telefone: document.getElementById("txtTelefone").value,
                email: document.getElementById("txtEmail").value
            };

            let metodo;
            let url;
            if (idusuarioedicao > 0) {
                metodo = "PUT";
                url = `/usuarios/${idusuarioedicao}`;
            } else {
                metodo = "POST";
                url = "/usuarios";
            }

            try {
                await fetchJson(url, {
                    method: metodo,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(usuario)
                });
                alert("Usuário salvo com sucesso!");
                modalUsuario.hide();
                carregaDados();
            } catch (err) {
                console.error(err);
                alert("Erro ao salvar usuário: " + (err.message || err));
            }
        }

        async function editar(idusuario) {
            idusuarioedicao = idusuario;
            try {
                const usuario = await fetchJson(`/usuarios/${idusuario}`);
                document.getElementById("txtNome").value = usuario.nome;
                document.getElementById("txtTelefone").value = usuario.telefone;
                document.getElementById("txtEmail").value = usuario.email;
                modalUsuario.show();
            } catch (err) {
                console.error(err);
                alert("Erro ao carregar usuário: " + (err.message || err));
            }
        }

        async function excluir(idusuario) {
            if (!confirm("Deseja realmente excluir este usuário?")) return;
            try {
                await fetchJson(`/usuarios/${idusuario}`, { method: "DELETE" });
                alert("Usuário excluído com sucesso!");
                carregaDados();
            } catch (err) {
                console.error(err);
                alert("Erro ao excluir usuário: " + (err.message || err));
            }
        }

        async function carregaDados() {
            const tbody = document.getElementById("dados");
            tbody.innerHTML = `<tr><td colspan="4">Carregando...</td></tr>`;
            const data = await fetchJson("/usuarios");
            tbody.innerHTML = "";
            for (const u of data) {
                tbody.innerHTML += `<tr>
                    <td>${u.nome}</td>
                    <td>${u.email}</td>
                    <td>${u.telefone}</td>
                    <td>
                        <button class="btn btn-danger" onclick="excluir(${u.idusuario})">Excluir</button>
                        <button class="btn btn-warning" onclick="editar(${u.idusuario})">Editar</button>
                    </td>
                    </tr>`;
            }
        }
        carregaDados();


        const modalUsuario = new bootstrap.Modal(document.getElementById('modalUsuario'));
        function novo() {
            idusuarioedicao = 0;
            document.getElementById("txtNome").value = "";
            document.getElementById("txtTelefone").value = "";
            document.getElementById("txtEmail").value = "";
            modalUsuario.show();
        }
    </script>

</html>
